services:
  - type: web
    name: smart-events
    runtime: node
    plan: free
    repo: https://github.com/DinoCzar/apple-calendar-api
    branch: main
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: AUTH_USERNAME
        sync: false
      - key: AUTH_PASSWORD
        sync: false
      - key: ICLOUD_USERNAME
        sync: false
      - key: ICLOUD_APP_PASSWORD
        sync: false
      - key: SMART_CALENDAR_NAME
        value: Smart Events
      - key: WORKING_HOURS_START
        value: "08:00"
      - key: WORKING_HOURS_END
        value: "21:00"
      - key: SCHEDULE_DAYS_AHEAD
        value: "7"
      - key: MIN_GAP_MINUTES
        value: "15"
      - key: TIMEZONE
        value: America/Los_Angeles
